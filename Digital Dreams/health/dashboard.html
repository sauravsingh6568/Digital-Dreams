<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LifeSync Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <nav class="navbar navbar-light bg-white shadow-sm px-4">
        <span class="navbar-brand mb-0 h1 text-primary">Health Dashboard</span>
    </nav>

    <div class="container py-5">
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card text-center shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Heart Rate</h5>
                        <p class="display-6 text-danger">76 BPM</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Blood Pressure</h5>
                        <p class="display-6 text-warning">120/80</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">SpO2 Level</h5>
                        <p class="display-6 text-success">98%</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
