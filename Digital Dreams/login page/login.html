<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="/login page/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div class="auth-container">
        <form class="auth-form" action="main.html">
            <h2>Sign In</h2>

            <div class="input-group">

                <input type="email" placeholder="Email address" required>
            </div>

            <div class="input-group">

                <input type="password" placeholder="Password" required>
            </div>

            <div class="btn-row">
                <!-- <button type="submit" class="btn">Sign In</button> -->
                <a href="/landing page/index.html" class="btn secondary">Sign In</a>
                <a href="/login page/signup/signup.html" class="btn secondary">Sign Up</a>
            </div>

            <p class="forgot"><a href="#">Forgot password?</a></p>
        </form>
    </div>
    <script src="/login page/script.js"></script>
</body>

</html>
