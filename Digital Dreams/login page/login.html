<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
  <nav>
    <a href="/index.html" style="text-decoration: none;">
      <div class="logo">LifeSync</div>
    </a>
    <ul class="mb-0">
      <a href="/index.html" style="text-decoration: none;">
        <li>Home</li>
      </a>
      <a href="#" style="text-decoration: none;">
        <li>Support</li>
      </a>
    </ul>
  </nav>

  <div class="container main d-flex align-items-center justify-content-center flex-wrap gap-5">
    <div class="img col-md-5 text-center">
      <img src="/Digital Dreams/landing page/assets/elder.png" alt="Elder" class="img-fluid" />

    </div>

    <div class="auth-container col-md-4">
      <form class="auth-form" id="loginForm">
        <h3 class="text-center mb-4">Sign In</h3>
        <input type="email" id="email" class="form-control" placeholder="Email address" required />
        <input type="password" id="password" class="form-control" placeholder="Password" required />
        <p class="text-center mt-2">
          <a href="#" class="text-decoration-none text-primary">Forgot password?</a>
        </p>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary">Log in</button>
        </div>
        <p class="mt-3 text-center">
          Don't have an account? <a href="/Digital Dreams/login page/signup.html" style="text-decoration: none;"><span
              class="text-primary" role="button">Sign-up</span></a>
        </p>
        <p id="successMessage" class="text-success text-center mt-3" style="display: none;">
          Login successful! Click
          <a href="/life%20sync%20app/dash.html" class="text-decoration-underline">here</a>
          if you're not redirected automatically.
        </p>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
  <!-- Removed conflicting inline script -->
</body>

</html>
