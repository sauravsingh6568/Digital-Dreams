<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>

  <body>
    <div class="auth-container">
      <form class="auth-form" id="loginForm">
        <h2>Sign In</h2>

        <div class="input-group">
          <input type="email" id="email" placeholder="Email address" required />
        </div>

        <div class="input-group">
          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          />
        </div>

        <div class="btn-row">
          <button type="submit" class="btn">Sign In</button>
          <a href="signup.html" class="btn secondary">Sign Up</a>
        </div>

        <p class="forgot"><a href="#">Forgot password?</a></p>

      
        <p id="successMessage" style="display: none">
          Login successful! Click
          <a href="/life sync app/firstpage.html" id="directLink">here</a> if
          you're not redirected automatically.
        </p>
      </form>
    </div>

    <script src="script.js"></script>
    <script>
     
      function showDirectLink() {
        document.getElementById("successMessage").style.display = "block";
      }

      if (document.getElementById("loginForm")) {
        document
          .getElementById("loginForm")
          .addEventListener("submit", function (e) {
            const email = document.getElementById("email").value;
            const userData = localStorage.getItem(email);

            if (userData) {
              const user = JSON.parse(userData);
              const password = document.getElementById("password").value;

              if (user.password === password) {
             
                setTimeout(showDirectLink, 2000);
              }
            }
          });
      }
    </script>
  </body>
</html>
