<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="/login page/signup/style.css">
</head>

<body>
    <div class="auth-container">
        <form class="auth-form" action="main.html">
            <h2>Sign Up</h2>

            <input type="text" placeholder="Full Name" required>
            <input type="date" placeholder="Date of Birth" required>
            <input type="email" placeholder="Gmail" required>
            <input type="tel" placeholder="Mobile Number" required>

            <button type="submit" class="btn full">Register</button>
        </form>
    </div>
    <script src="/login page/signup/script.js"></script>
</body>

</html>
