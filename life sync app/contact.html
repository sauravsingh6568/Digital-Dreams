<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact & Support</title>
  <link rel="icon" href="/Digital Dreams/landing page/assets/elder.png">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #f0f2f5, #e6e9f0);
      font-family: "Segoe UI", sans-serif;
      padding-top: 60px;
      padding-bottom: 60px;
    }

    .contact-header {
      font-weight: bold;
      color: #4a00e0;
    }

    .contact-form {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .btn-primary {
      background: linear-gradient(to right, #8e2de2, #4a00e0);
      border: none;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .alert {
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="text-center mb-4">
      <h2 class="contact-header">Contact & Support</h2>
      <p>If you have questions or need help, feel free to contact our support team. We'll get back to you as soon as
        possible.</p>
    </div>

    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <form id="contactForm" class="contact-form">
          <div class="mb-3">
            <label for="name" class="form-label">Your Name</label>
            <input type="text" class="form-control rounded-3" id="name" placeholder="Enter your name" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Your Email</label>
            <input type="email" class="form-control rounded-3" id="email" placeholder="Enter your email" required>
          </div>

          <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control rounded-3" id="message" rows="5" placeholder="Type your message here..."
              required></textarea>
          </div>

          <button type="submit" class="btn btn-primary w-100 fw-semibold">Send Message</button>

          <div id="formMessage" class="alert alert-success mt-3 d-none"></div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Contact Form Script -->
  <script>
    const contactForm = document.getElementById('contactForm');
    const formMessage = document.getElementById('formMessage');

    contactForm.addEventListener('submit', function (e) {
      e.preventDefault();
      formMessage.classList.remove('d-none');
      formMessage.textContent = "✅ Your message has been sent! We'll respond soon.";
      contactForm.reset();
    });
  </script>
</body>

</html>
