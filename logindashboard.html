<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LifeSync Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-gradient-to-br from-violet-500 to-pink-400 min-h-screen flex items-center justify-center"
  >
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center">
      <!-- Family Image -->
      <img
        src="/Digital Dreams/landing page/assets/log dash.png"
        alt="Family Illustration"
        class="w-48 mx-auto mb-6"
      />

      <h1 class="text-3xl font-bold text-gray-800 mb-3">Welcome to LifeSync</h1>
      <p class="text-gray-600 mb-6">Please select how you want to login</p>

      <div class="flex flex-col gap-4">
        <a
          href="./login elder page/login.html"
          class="bg-violet-600 text-white px-6 py-3 rounded-xl hover:bg-violet-700 transition"
        >
          Login as Elder
        </a>
        <a
          href="./login family page/login.html"
          class="bg-pink-500 text-white px-6 py-3 rounded-xl hover:bg-pink-600 transition"
        >
          Login as Family
        </a>
      </div>
    </div>
  </body>
</html>
