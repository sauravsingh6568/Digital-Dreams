<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up</title>
  <link rel="icon" href="/Digital Dreams/landing page/assets/elder.png">

  <link rel="stylesheet" href="signupstyle.css" />
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
  <nav>
    <a href="/index.html" style="text-decoration: none;">
      <div class="logo">LifeSync</div>
    </a>
    <ul class="mb-0">
      <a href="/logindashboard.html" style="text-decoration: none;">
        <li>Home</li>
      </a>
      <a href="/Digital Dreams/landing page/contact.html" style="text-decoration: none;">
        <li>Support</li>
      </a>
    </ul>
  </nav>

  <div class="auth-container">
    <form class="auth-form" id="signupForm">
      <h2>Sign Up</h2>

      <div class="input-group">
        <input type="text" id="fullName" placeholder="Full Name" required />
      </div>

      <div class="input-group">
        <input type="date" id="dob" placeholder="Date of Birth" required />
      </div>

      <div class="input-group">
        <input type="email" id="email" placeholder="Email" required />
      </div>

      <div class="input-group">
        <input type="tel" id="mobile" placeholder="Mobile Number" required />
      </div>

      <div class="input-group">
        <input type="password" id="password" placeholder="Password" required />
      </div>

      <button type="submit" class="btn full">Register</button>

      <p>Already have an account? <a href="login.html">Sign In</a></p>

      <!-- Added success message as fallback -->
      <p id="registrationSuccess" style="display: none">
        Registration successful! Click
        <a href="login.html">here</a> if you're not redirected automatically.
      </p>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script src="script.js"></script>
</body>

</html>
